name: Keep Render Service Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier spin-down (inactivity timeout is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          URL="${{ vars.RENDER_SERVICE_URL || secrets.RENDER_SERVICE_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_SERVICE_URL is not set. Please set it in Settings -> Secrets and variables -> Actions."
            echo "Example: https://traffic-sign-api.onrender.com"
            exit 0
          fi
          echo "Pinging ${URL}/health ..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "${URL}/health")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Service is awake and healthy! (HTTP $STATUS)"
          else
            echo "Warning: Received HTTP $STATUS"
          fi
